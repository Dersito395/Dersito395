# Gera o APK de teste do SOBREVIVA (Android) e o disponibiliza para download
# em Actions › execução › Artifacts. Assinado com chave de depuração: só para testes.
name: SOBREVIVA – APK de teste

on:
  push:
    paths:
      - "sobreviva/**"
      - ".github/workflows/sobreviva-android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sobreviva/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Build do APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: sobreviva-apk-teste
          path: sobreviva/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
