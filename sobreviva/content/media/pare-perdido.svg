<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' width='400' height='260'><rect x='0' y='0' width='400' height='260' rx='14' fill='#F7F7F3'/><rect x='0' y='0' width='400' height='34' rx='14' fill='#364536'/><rect x='0' y='20' width='400' height='14' fill='#364536'/><text x='16' y='23' font-family='Roboto' font-size='15' font-weight='700' fill='#F7F7F3'>Perdido? Use o método PARE</text><rect x='20' y='60' width='84' height='150' rx='12' fill='#364536'/><text x='62' y='112' font-family='Roboto' font-size='40' font-weight='700' fill='#E58A32' text-anchor='middle'>P</text><text x='62' y='150' font-family='Roboto' font-size='12' font-weight='700' fill='#F7F7F3' text-anchor='middle'>PARE</text><text x='62' y='170' font-family='Roboto' font-size='10' font-weight='400' fill='#F7F7F3' text-anchor='middle'>sente, beba</text><text x='62' y='184' font-family='Roboto' font-size='10' font-weight='400' fill='#F7F7F3' text-anchor='middle'>água, respire</text><rect x='112' y='60' width='84' height='150' rx='12' fill='#1D2922'/><text x='154' y='112' font-family='Roboto' font-size='40' font-weight='700' fill='#E58A32' text-anchor='middle'>A</text><text x='154' y='150' font-family='Roboto' font-size='12' font-weight='700' fill='#F7F7F3' text-anchor='middle'>ANALISE</text><text x='154' y='170' font-family='Roboto' font-size='10' font-weight='400' fill='#F7F7F3' text-anchor='middle'>último ponto</text><text x='154' y='184' font-family='Roboto' font-size='10' font-weight='400' fill='#F7F7F3' text-anchor='middle'>conhecido</text><rect x='204' y='60' width='84' height='150' rx='12' fill='#364536'/><text x='246' y='112' font-family='Roboto' font-size='40' font-weight='700' fill='#E58A32' text-anchor='middle'>R</text><text x='246' y='150' font-family='Roboto' font-size='12' font-weight='700' fill='#F7F7F3' text-anchor='middle'>RECONHEÇA</text><text x='246' y='170' font-family='Roboto' font-size='10' font-weight='400' fill='#F7F7F3' text-anchor='middle'>terreno, luz,</text><text x='246' y='184' font-family='Roboto' font-size='10' font-weight='400' fill='#F7F7F3' text-anchor='middle'>clima, recursos</text><rect x='296' y='60' width='84' height='150' rx='12' fill='#1D2922'/><text x='338' y='112' font-family='Roboto' font-size='40' font-weight='700' fill='#E58A32' text-anchor='middle'>E</text><text x='338' y='150' font-family='Roboto' font-size='12' font-weight='700' fill='#F7F7F3' text-anchor='middle'>ELABORE</text><text x='338' y='170' font-family='Roboto' font-size='10' font-weight='400' fill='#F7F7F3' text-anchor='middle'>fique visível,</text><text x='338' y='184' font-family='Roboto' font-size='10' font-weight='400' fill='#F7F7F3' text-anchor='middle'>peça socorro</text><text x='200' y='240' font-family='Roboto' font-size='12' font-weight='700' fill='#242827' text-anchor='middle'>Se alguém sabe seu roteiro: em geral, fique no lugar</text></svg>